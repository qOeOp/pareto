name: observe-install-capability

on: workflow_dispatch

permissions:
  contents: read

jobs:
  observe:
    name: observe-${{ matrix.os }}
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: observer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: subject
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: observer/package-lock.json
      - run: npm ci --ignore-scripts --prefix observer
      - name: Observe INS-01 through the real Codex Skill loader
        run: >-
          node observer/scripts/observe-install-capability.mjs
          --subject-root subject
          --codex-entry observer/node_modules/@openai/codex/bin/codex.js
          --output observation-${{ runner.os }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ins-01-${{ runner.os }}
          path: observation-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 1

  attest:
    name: attest-complete-campaign
    needs: observe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: observer
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ins-01-*
          path: observations
          merge-multiple: true
      - name: Aggregate the exact Linux and Windows observations
        run: >-
          node observer/scripts/observe-install-capability.mjs
          --input-dir observations
          --output ins-01-campaign.json
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ins-01-campaign.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ins-01-attested-${{ github.run_id }}
          path: |
            ins-01-campaign.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
