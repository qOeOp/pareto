name: observe-install-capability

on: workflow_dispatch

permissions:
  contents: read

jobs:
  observe:
    name: observe-${{ matrix.capability.slug }}-${{ matrix.os }}-${{ matrix.trial }}
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        capability:
          - id: INS-01
            observation: observation
            slug: ins-01
          - id: INS-03
            observation: observation-ins-03
            slug: ins-03
          - id: INS-05
            observation: observation-ins-05
            slug: ins-05
          - id: INS-07
            observation: observation-ins-07
            slug: ins-07
          - id: INS-09
            observation: observation-ins-09
            slug: ins-09
        os:
          - ubuntu-latest
          - windows-latest
        trial:
          - 1
          - 2
          - 3
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: observer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: subject
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: observer/package-lock.json
      - run: npm ci --ignore-scripts --prefix observer
      - name: Observe the fixed installation capability through its real consumer
        run: >-
          node observer/scripts/observe-install-capability.mjs
          --capability ${{ matrix.capability.id }}
          --subject-root subject
          --codex-entry observer/node_modules/@openai/codex/bin/codex.js
          --trial ${{ matrix.trial }}
          --output ${{ matrix.capability.observation }}-${{ runner.os }}-${{ matrix.trial }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-${{ matrix.capability.slug }}-${{ runner.os }}-${{ matrix.trial }}
          path: ${{ matrix.capability.observation }}-${{ runner.os }}-${{ matrix.trial }}.json
          if-no-files-found: error
          retention-days: 1

  attest-observation:
    name: attest-${{ matrix.capability.slug }}-${{ matrix.runner }}-${{ matrix.trial }}
    needs: observe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        capability:
          - id: INS-01
            observation: observation
            slug: ins-01
          - id: INS-03
            observation: observation-ins-03
            slug: ins-03
          - id: INS-05
            observation: observation-ins-05
            slug: ins-05
          - id: INS-07
            observation: observation-ins-07
            slug: ins-07
          - id: INS-09
            observation: observation-ins-09
            slug: ins-09
        runner:
          - Linux
          - Windows
        trial:
          - 1
          - 2
          - 3
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raw-${{ matrix.capability.slug }}-${{ matrix.runner }}-${{ matrix.trial }}
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.capability.observation }}-${{ matrix.runner }}-${{ matrix.trial }}.json
      - name: Stage the observation attestation at a deterministic path
        run: >-
          node -e
          "require('node:fs').copyFileSync(process.argv[1], process.argv[2], require('node:fs').constants.COPYFILE_EXCL)"
          "${{ steps.attest.outputs.bundle-path }}"
          attestation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.capability.slug }}-${{ matrix.runner }}-${{ matrix.trial }}
          path: |
            ${{ matrix.capability.observation }}-${{ matrix.runner }}-${{ matrix.trial }}.json
            attestation.json
          if-no-files-found: error
          retention-days: 1

  aggregate:
    name: aggregate-${{ matrix.capability.slug }}
    needs: attest-observation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        capability:
          - id: INS-01
            slug: ins-01
          - id: INS-03
            slug: ins-03
          - id: INS-05
            slug: ins-05
          - id: INS-07
            slug: ins-07
          - id: INS-09
            slug: ins-09
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: observer
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ matrix.capability.slug }}-*
          path: observations
      - name: Aggregate the exact Linux and Windows observations
        run: >-
          node observer/scripts/observe-install-capability.mjs
          --capability ${{ matrix.capability.id }}
          --input-dir observations
          --output ${{ matrix.capability.slug }}-campaign.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-${{ matrix.capability.slug }}-campaign
          path: ${{ matrix.capability.slug }}-campaign.json
          if-no-files-found: error
          retention-days: 1

  attest-campaign:
    name: attest-complete-${{ matrix.capability.slug }}-campaign
    needs: aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        capability:
          - id: INS-01
            slug: ins-01
          - id: INS-03
            slug: ins-03
          - id: INS-05
            slug: ins-05
          - id: INS-07
            slug: ins-07
          - id: INS-09
            slug: ins-09
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raw-${{ matrix.capability.slug }}-campaign
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ matrix.capability.slug }}-*
          path: observations
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.capability.slug }}-campaign.json
      - name: Stage the campaign attestation at a deterministic path
        run: >-
          node -e
          "require('node:fs').copyFileSync(process.argv[1], process.argv[2], require('node:fs').constants.COPYFILE_EXCL)"
          "${{ steps.attest.outputs.bundle-path }}"
          ${{ matrix.capability.slug }}-campaign-attestation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.capability.slug }}-attested-${{ github.run_id }}
          path: |
            ${{ matrix.capability.slug }}-campaign.json
            observations/**/observation-*.json
            observations/**/attestation.json
            ${{ matrix.capability.slug }}-campaign-attestation.json
          if-no-files-found: error
          retention-days: 30
