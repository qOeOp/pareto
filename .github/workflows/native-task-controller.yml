name: native-task-controller

on:
  pull_request:
    paths:
      - .github/workflows/native-task-controller.yml
      - scripts/native-task-controller.mjs
      - scripts/native-task-controller.test.mjs
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-task-controller.yml
      - scripts/native-task-controller.mjs
      - scripts/native-task-controller.test.mjs

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --check scripts/native-task-controller.mjs
      - run: node scripts/native-task-controller.test.mjs
