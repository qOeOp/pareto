name: observe-score-capability

on: workflow_dispatch

permissions:
  actions: read
  contents: read

jobs:
  observe:
    name: observe-${{ matrix.os }}
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: observer
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: observer/package-lock.json
      - run: npm ci --ignore-scripts --prefix observer
      - name: Download the fixed canonical INS-01 evidence input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ins-01-attested-31416162223
          path: source-campaign
          run-id: 31416162223
      - name: Observe EVAL-02 through the real scorer CLI
        run: >-
          node observer/scripts/observe-score-capability.mjs
          --source-campaign-dir source-campaign
          --output observation-${{ runner.os }}-1.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-eval-02-${{ runner.os }}-1
          path: |
            observation-${{ runner.os }}-1.json
            reports/**
          if-no-files-found: error
          retention-days: 1

  attest-observation:
    name: attest-${{ matrix.runner }}
    needs: observe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runner:
          - Linux
          - Windows
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raw-eval-02-${{ matrix.runner }}-1
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: observation-${{ matrix.runner }}-1.json
      - name: Stage the observation attestation at a deterministic path
        run: >-
          node -e
          "require('node:fs').copyFileSync(process.argv[1], process.argv[2], require('node:fs').constants.COPYFILE_EXCL)"
          "${{ steps.attest.outputs.bundle-path }}"
          attestation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-02-${{ matrix.runner }}-1
          path: |
            observation-${{ matrix.runner }}-1.json
            attestation.json
            reports/**
          if-no-files-found: error
          retention-days: 1

  aggregate:
    name: aggregate-complete-campaign
    needs: attest-observation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: observer
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: eval-02-*
          path: observations
      - name: Download the fixed canonical INS-01 evidence input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ins-01-attested-31416162223
          path: source-campaign
          run-id: 31416162223
      - name: Aggregate the exact Linux and Windows observations
        run: >-
          node observer/scripts/observe-score-capability.mjs
          --input-dir observations
          --output eval-02-campaign.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-eval-02-campaign
          path: |
            eval-02-campaign.json
            source-campaign/**
          if-no-files-found: error
          retention-days: 1

  attest:
    name: attest-complete-campaign
    needs: aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raw-eval-02-campaign
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: eval-02-*
          path: observations
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: eval-02-campaign.json
      - name: Stage the campaign attestation at a deterministic path
        run: >-
          node -e
          "require('node:fs').copyFileSync(process.argv[1], process.argv[2], require('node:fs').constants.COPYFILE_EXCL)"
          "${{ steps.attest.outputs.bundle-path }}"
          eval-02-campaign-attestation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-02-attested-${{ github.run_id }}
          path: |
            eval-02-campaign.json
            observations/**/observation-*.json
            observations/**/attestation.json
            observations/**/reports/**
            eval-02-campaign-attestation.json
            source-campaign/**
          if-no-files-found: error
          retention-days: 30
