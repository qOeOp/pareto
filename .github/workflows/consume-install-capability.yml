name: consume-install-capability

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact successful observe-install-skill-capability run ID
        required: true
        type: string

permissions: {}

jobs:
  consume:
    name: consume-ins-01-v2-campaign
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: consumer
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: consumer/package-lock.json
      - run: npm ci --prefix consumer --ignore-scripts
      - name: Bind the signed first run and complete job inventory
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "source_run_id must be a positive integer" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > source-run-metadata.json
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/attempts/1/jobs?per_page=100" \
            > source-run-jobs.json
      - name: Download the exact INS-01 v2 campaign
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: ins-01-v2-attested-${{ inputs.source_run_id }}
          path: campaign
          run-id: ${{ inputs.source_run_id }}
      - name: Verify every signed campaign input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_HEAD_SHA="$(jq -er '.head_sha | select(test("^[a-f0-9]{40}$"))' source-run-metadata.json)"
          SIGNER_WORKFLOW="github.com/${GITHUB_REPOSITORY}/.github/workflows/observe-install-skill-capability.yml"
          mapfile -t OBSERVATIONS < <(find campaign/observations -type f -name 'observation-*.json' -print | LC_ALL=C sort)
          test "${#OBSERVATIONS[@]}" -eq 6
          : > attestation-verification.jsonl
          for OBSERVATION in "${OBSERVATIONS[@]}"; do
            gh attestation verify "$OBSERVATION" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$(dirname "$OBSERVATION")/attestation.json" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-digest "$SOURCE_HEAD_SHA" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners \
              --format json | jq -ce 'if length == 1 then .[0] else error("expected one verification") end' \
              >> attestation-verification.jsonl
          done
          gh attestation verify campaign/ins-01-campaign.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle campaign/ins-01-campaign-attestation.json \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --source-digest "$SOURCE_HEAD_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json | jq -ce 'if length == 1 then .[0] else error("expected one verification") end' \
            >> attestation-verification.jsonl
          test "$(wc -l < attestation-verification.jsonl | tr -d ' ')" -eq 7
      - name: Consume the complete campaign attempt set
        run: >-
          node consumer/scripts/consume-install-capability.mjs
          --campaign-dir campaign
          --source-run-id "${{ inputs.source_run_id }}"
          --source-run-metadata source-run-metadata.json
          --source-run-jobs source-run-jobs.json
          --attestation-verification attestation-verification.jsonl
          --output install-consumption-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-consumption-input-${{ github.run_id }}
          path: |
            install-consumption-receipt.json
            attestation-verification.jsonl
            source-run-metadata.json
            source-run-jobs.json
            campaign/
          if-no-files-found: error
          retention-days: 1

  attest:
    name: attest-ins-01-v2-consumption
    needs: consume
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: install-consumption-input-${{ github.run_id }}
          path: input
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: input/install-consumption-receipt.json
      - name: Stage the consumption attestation at a deterministic path
        run: >-
          node -e
          "require('node:fs').copyFileSync(process.argv[1], process.argv[2], require('node:fs').constants.COPYFILE_EXCL)"
          "${{ steps.attest.outputs.bundle-path }}"
          input/install-consumption-receipt-attestation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ins-01-v2-consumed-${{ github.run_id }}
          path: input/
          if-no-files-found: error
          retention-days: 30
