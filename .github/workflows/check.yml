name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node --check scripts/observe-score-capability.mjs && node scripts/observe-score-capability.test.mjs
      - run: go test skills/run-bounded-mission/scripts/delivery-receipt.go skills/run-bounded-mission/scripts/delivery-receipt_test.go
