name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: go test skills/run-bounded-mission/scripts/delivery-receipt.go skills/run-bounded-mission/scripts/delivery-receipt_test.go
