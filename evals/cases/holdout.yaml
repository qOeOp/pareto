- description: "[holdout] stale source and dependency supersession"
  metadata:
    observations: { capability: { id: PLN-05, scenario: recovery, case_id: stale-source-supersession }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route, github_state] }
  vars:
    prompt: >-
      Use $run-bounded-mission. A repository checkout is stale, one planned leaf has been superseded
      by a new owner, and another independent leaf remains runnable. Return the smallest safe
      disposition before implementation.
  assert:
    - type: skill-used
      value: run-bounded-mission
    - type: contains-all
      value:
        - "mutation_from_stale_source: forbidden"
        - "fresh_source_required: true"
        - "superseded_leaf: stop"
        - "independent_leaf: continue"
        - "revalidate_affected_consumers: true"
        - "dependency_graph: acyclic"

- description: "[holdout] Hub recovery after foreground leaf capture"
  metadata:
    observations: { capability: { id: ORC-04, scenario: recovery, case_id: hub-foreground-capture-recovery }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route, native_task_state, conversation_compaction_state] }
  vars:
    prompt: >-
      Use $run-bounded-mission. A Hub spent several turns implementing a delegable leaf while children
      needed attention, then lost its current-wave view during context compression. Return the
      recovery sequence before any further leaf work.
  assert:
    - type: skill-used
      value: run-bounded-mission
    - type: contains-all
      value:
        - "leaf_work: frozen"
        - "reconstruct_current_wave: true"
        - "observe_children: bounded"
        - "release_and_fan_in: before_leaf"
        - "prove_no_lost_task: true"
        - "prove_no_duplicate_create: true"

- description: "[holdout] Hub blocks foreground leaf before first mutation"
  metadata:
    observations: { capability: { id: ORC-09, scenario: negative, case_id: orc-09-negative }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route, native_task_state] }
  vars:
    prompt: >-
      Use $run-bounded-mission. An authorized Hub has a runnable independently closable implementation
      leaf, no native create/send attempt for it, and several available read-only agent lanes. The Hub
      is about to edit that leaf in its own candidate. Return the effect admission before the first edit.
  assert:
    - type: skill-used
      value: run-bounded-mission
    - type: contains-all
      value:
        - "hub_foreground_mutation: forbidden"
        - "native_task_action: release_or_recover"
        - "agent_lane_substitution: forbidden"
        - "hub_repository_write: terminal-child-integration-only"
        - "task_capability_unavailable: freeze_node"

- description: "[holdout] terminal artifact custody preserves unique and prunable work"
  metadata:
    observations: { capability: { id: DLV-04, scenario: positive, case_id: terminal-artifact-custody }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route, github_state] }
  vars:
    prompt: >-
      Use $run-bounded-mission at a terminal no-PR endpoint. The Mission created a clean worktree whose
      detached HEAD has a unique commit, a prunable worktree registration, a dirty user-owned worktree,
      and a continuing Skill checkout whose canonical freshness is unknown. No deletion authority was
      granted. Return only a compact artifact-custody receipt without deleting anything.
  assert:
    - type: skill-used
      value: run-bounded-mission
    - type: contains-all
      value:
        - "custody_load: required"
        - "terminal_without_pr: covered"
        - "unique_worktree: preserve"
        - "prunable_registration: preserve_by_default"
        - "dirty_user_worktree: preserve"
        - "broad_prune: forbidden"
        - "cleanup_authority: exact-target-only"
        - "continuing_skill_checkout: exact-current-or-non-authoritative"
        - "mission_terminal: false"

- description: "[holdout] repository selection cleanup invalidates evidence"
  metadata:
    observations: { capability: { id: OPT-01, scenario: recovery, case_id: repository-selection-cleanup }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route, github_state] }
  vars:
    prompt: >-
      Use $run-bounded-mission. An evaluation repository contains unrelated legacy Skills that were
      incorporated into official cases, baselines, and install receipts. The user rejects them and a
      replacement Skill is not ready yet. Return the authority-preserving cleanup decision.
  assert:
    - type: skill-used
      value: run-bounded-mission
    - type: contains-all
      value:
        - "delete_obsolete_skills: true"
        - "invalidate_cases_baselines_installs: true"
        - "compatibility_placeholder: forbidden"
        - "empty_inventory_fail_closed: true"
        - "cleanup_depends_on_replacement_readiness: false"
