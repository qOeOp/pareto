        - "reconcile_evidence: true"
        - "reconcile_unissued_effect: true"
        - "preserve_next_edge: true"

- description: "[full] mode selection re-evaluates after scope change"
  metadata:
    observations: { capability: { id: ORC-01, scenario: recovery, case_id: mode-reevaluation-after-scope-change }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route, native_task_state] }
