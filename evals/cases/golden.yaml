- description: "[full] high score cannot complete an unproved Goal"
  metadata:
    observations: { behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route, native_goal_state] }
  vars:
    prompt: >-
      Use $run-bounded-mission. An overall Goal is numerically scored above 9.5, but one mandatory
      floor fails, a major gap remains, and a key claim is unproved. Return the completion decision.
  assert:
    - type: skill-used
      value: run-bounded-mission
    - type: contains-all
      value:
        - "goal_complete: false"
        - "threshold_score_authority: false"
        - "failed_floor: blocking"
        - "major_gap: blocking"
        - "unproved_key_claim: blocking"
        - "status: incomplete"
