        - "hub_executes_material_leaf: false"
        - "hub_dispatches_node_lane: false"
        - "node_local_owner: exact_child"
        - "native_task_action: release_or_continue_existing_child"
        - "child_creates_nested_task: false"
        - "observe_current_wave: true"
        - "release_dependencies: true"
        - "fan_in_once: true"
        - "near_miss: bounded-hub-only-control"
        - "recovery: restore-wave-without-loss-or-duplicate"

