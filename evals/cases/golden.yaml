- description: "[full] task persistence without loss or duplicate"
  metadata:
    observations: { capability: { id: ORC-02, scenario: recovery, case_id: task-identity-reconciliation }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route, native_task_state] }
  vars:
    prompt: >-
      Use $run-bounded-mission. A recovered Hub has several approved task attempts, including one
      unresolved create receipt and one completed child. A bounded live listing shows an exact
      collision with the recorded task identity plus a same-title resemblance. Return the identity
      reconciliation rules before any new create or release.
  assert:
    - type: skill-used
      value: run-bounded-mission
    - type: contains-all
      value:
        - "preserve_task_inventory: true"
        - "unresolved_attempt: retained"
        - "fuzzy_title_adoption: forbidden"
        - "duplicate_create: forbidden"
        - "release_before_identity: forbidden"
        - "exact_collision_action: reuse_recorded_task"
        - "ambiguous_create_disposition: host-defect/no-change"
        - "replacement_task: forbidden"
        - "substitute_task: forbidden"
    - type: not-contains
      value: "pre_create_live_type_number_inventory: required"
    - type: not-contains
      value: "collision_recovery: rename-existing-identity"
    - type: not-contains
      value: "superseding_identity: required"

- description: "[full] task creation failure preserves no-change"
  metadata:
    observations: { capability: { id: ORC-02, scenario: negative, case_id: task-create-host-failure }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route, native_task_state] }
  vars:
    prompt: >-
      Use $run-bounded-mission. An authorized native task-create call returned only a generic host
      error, with no task identity or pending receipt. A bounded task listing confirms no matching
      identity. Other DAG nodes remain runnable. Return the correct recovery disposition.
  assert:
    - type: skill-used
      value: run-bounded-mission
    - type: contains-all
      value:
        - "record_attempt: true"
        - "effect_disposition: host-defect/no-change"
        - "automatic_retry: forbidden"
        - "replacement_task: forbidden"
        - "adopt_similar_task: forbidden"
        - "continue_runnable_nodes: true"
    - type: not-contains
      value: "retry_requires_fresh_authority: true"

- description: "[full] Hub commander duty inversion"
  metadata:
    observations: { capability: { id: ORC-03, scenario: recovery, case_id: hub-commander-duty-recovery }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route, native_task_state] }
  vars:
