      Use $run-bounded-mission. After an ambiguous PR-create result, an owner-authorized readback finds
      one existing PR whose repository, base, head OID, branch, title, body, and Ready state exactly match
      the frozen publication input. Return the recovery; also state the no-match boundary.
  assert:
    - type: skill-used
      value: run-bounded-mission
    - type: equals
      value: |-
        matching_existing_pr: bind
        identity_fields: repository-number-url-base-head-ref-oid-title-body-state
        create_retry: false
        replacement_pr: false
        publication_recovery: same-effect-readback
        no_exact_match: partial-or-unknown-stop
        merge_authority: unchanged

