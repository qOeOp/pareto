- description: "[smoke] explicit bounded mission invocation"
  metadata:
    observations: { capability: { id: KRN-02, scenario: positive, case_id: request-admission-direct }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route] }
  vars:
    prompt: >-
      Use $run-bounded-mission. In README.md, replace only the opening description's word
      `collection` with `repository` for the reader consumer; acceptance is that exact sentence change
      with no other text or external effect. Inspect but do not edit. Return only Request Admission.
  assert:
    - type: skill-used
      value: run-bounded-mission
    - type: contains-all
      value:
        - "Request admission projection"
        - "Original request"
        - "User-owned intent / authority"
        - "Consumer / no-change harm"
        - "admission_depth: Direct"
        - "next_stage: Frame"
        - "conditional_owner_loaded: false"

- description: "[smoke] quoted token answer-only near miss"
  metadata:
    observations: { capability: { id: KRN-01, scenario: negative, case_id: quoted-token-nonactivation }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: not_used }, required_raw_item_types: [], unavailable: [host_native_skill_route] }
  vars:
    prompt: >-
      This is answer-only. Explain why quoting the token $run-bounded-mission is not an invocation.
      Do not run a workflow. Return two lines with the keys classification and activation.
  assert:
    - type: not-skill-used
      value: run-bounded-mission
    - type: contains-all
      value:
        - "classification: answer-only"
        - "activation: none"

- description: "[full] repository rule auto trigger"
  metadata:
    observations: { capability: { id: KRN-02, scenario: recovery, case_id: repository-trigger-needs-alignment }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route] }
  vars:
    prompt: >-
      Plan a non-trivial repository implementation under the repository instructions, but no Outcome,
      consumer, acceptance, or permitted effect has been supplied. Do not edit files. Return the
      required entrance-gate disposition. Do not explicitly name any Skill in your answer.
  assert:
    - type: skill-used
      value: run-bounded-mission
    - type: contains-all
      value:
        - "Request admission projection"
        - "Original request"
        - "admission_status: needs_user_alignment"
        - "frame_created: false"

- description: "[full] consumerless request does not reach Frame"
  metadata:
    observations: { capability: { id: KRN-02, scenario: negative, case_id: consumerless-not-admitted }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route] }
  vars:
    prompt: >-
      Use $run-bounded-mission. Add a new registry that has no caller, runtime entry, or observable
      acceptance behavior. Return only the Request Admission result and effect disposition.
  assert:
    - type: skill-used
      value: run-bounded-mission
    - type: contains-all
      value:
        - "admission_status: not_admitted"
        - "real_consumer: none"
        - "frame_created: false"
        - "mutation: forbidden"
    - type: not-contains
      value: "admission_status: admitted_normalized"

- description: "[full] nonactivation boundary classification"
  metadata:
    observations: { capability: { id: KRN-01, scenario: negative, case_id: answer-only-nonactivation }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: not_used }, required_raw_item_types: [], unavailable: [host_native_skill_route] }
  vars:
    prompt: >-
      This is an answer-only classification request. Classify explain-only, audit-only,
      diagnose-only, mechanical edit, routine status, and task-management requests against the
      bounded-mission activation boundary. Do not invoke a Skill. Return a compact classification
      receipt.
  assert:
    - type: not-skill-used
      value: run-bounded-mission
    - type: contains-all
      value:
        - "explain-only: no"
        - "audit-only: no"
        - "diagnose-only: no"
        - "mechanical-edit: no"
        - "routine-status: no"
        - "task-management: no"

- description: "[full] decision evidence routing and lazy owner loading"
  metadata:
    observations: { capability: { id: PLN-01, scenario: positive, case_id: decision-evidence-lazy-owner }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route, native_task_state] }
