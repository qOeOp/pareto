    observations: { capability: { id: INS-05, scenario: positive, case_id: ins-05-positive }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route] }
  vars:
    prompt: >-
      Use $run-bounded-mission. A lock-bound installer writes mission-evaluator.toml from the exact
      committed source into an isolated CODEX_HOME/agents directory. The installed bytes
      match the source, the other owned profiles reconcile from the same lock, foreign profiles stay
      unchanged, and --check passes. Return exactly the
      file-install decision below without claiming native evaluator routing or scored evidence.
  assert:
    - type: skill-used
      value: run-bounded-mission
    - type: equals
      value: |-
        profile: mission-evaluator.toml
        install_status: admitted
        source_bytes: exact
        other_owned_profiles: reconciled_from_same_lock
        foreign_profiles: unchanged
        post_install_check: pass
        native_role_routing: unavailable
        capability_evidence: unavailable

- description: "[full] evaluator profile drift is rejected without mutation"
  metadata:
    observations: { capability: { id: INS-05, scenario: negative, case_id: ins-05-negative }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route] }
  vars:
    prompt: >-
      Use $run-bounded-mission. The installed mission-evaluator.toml bytes differ from the exact committed
      source. A read-only --check observes the mismatch. Return exactly the fail-closed decision below;
      do not rewrite the profile, touch unrelated files, or infer evaluator execution.
  assert:
    - type: skill-used
      value: run-bounded-mission
    - type: equals
      value: |-
        profile: mission-evaluator.toml
        check_status: rejected
        reason: profile_bytes_mismatch
        destination_mutation: none
        all_profile_files_after_check: unchanged
        native_role_routing: unavailable
        capability_evidence: unavailable

- description: "[full] evaluator profile drift recovers through exact reinstall"
  metadata:
    observations: { capability: { id: INS-05, scenario: recovery, case_id: ins-05-recovery }, behavioral_oracle: deterministic_text, skill_activation: { status: dynamic_heuristic, expected: used }, required_raw_item_types: [command_execution], unavailable: [host_native_skill_route] }
  vars:
    prompt: >-
      Use $run-bounded-mission. A prior --check retained an exact mismatch for mission-evaluator.toml.
      A separately authorized lock-bound reinstall restores the committed bytes, reconciles
      the other owned profiles from the same lock, preserves foreign profiles, and a new --check passes.
  assert:
    - type: skill-used
      value: run-bounded-mission
    - type: equals
      value: |-
        profile: mission-evaluator.toml
        original_check: failed_retained
        reinstall_authority: separate_and_exact
        restored_bytes: exact
        other_owned_profiles: reconciled_from_same_lock
        foreign_profiles: unchanged
        post_install_check: pass
        native_role_routing: unavailable
        capability_evidence: unavailable

